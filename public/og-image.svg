<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Social Home — the social home for your household">
  <defs>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="rgba(35, 24, 8, 0.06)"/>
    </pattern>
    <linearGradient id="warmth" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F4ECE0"/>
      <stop offset="1" stop-color="#ECE0CE"/>
    </linearGradient>
    <linearGradient id="hearthGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#D2542A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D2542A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mossGlow" x1="1" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#1F4438" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1F4438" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#warmth)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>
  <rect width="1200" height="630" fill="url(#hearthGlow)"/>
  <rect width="1200" height="630" fill="url(#mossGlow)"/>

  <!-- Logo mark (top-left) -->
  <g transform="translate(80,80)">
    <path d="M0 44 L40 4 L80 44 V72 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 Z"
          stroke="#1A1814" stroke-width="4" stroke-linejoin="round" fill="none"/>
    <path d="M62 28 H78 a4 4 0 0 1 4 4 V42 a4 4 0 0 1 -4 4 H72 L66 50 V46 H68 a0 0 0 0 0 -1 0 Z"
          fill="#D2542A"/>
    <circle cx="22" cy="60" r="3" fill="#1A1814"/>
    <circle cx="40" cy="60" r="3" fill="#1A1814"/>
    <circle cx="58" cy="60" r="3" fill="#1A1814"/>
    <path d="M22 60 H58" stroke="#1A1814" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.6 5"/>
  </g>

  <!-- Wordmark + motto -->
  <g transform="translate(190,108)">
    <text font-family="'Fraunces', 'Iowan Old Style', Georgia, serif" font-weight="600"
          font-size="34" fill="#1A1814" letter-spacing="-0.5">Social <tspan fill="#D2542A" font-style="italic">Home</tspan></text>
    <text font-family="'JetBrains Mono', monospace" font-weight="500"
          font-size="13" fill="#807766" y="22" letter-spacing="2.4">HOUSEHOLD OS · FEDERATED · MPL 2.0</text>
  </g>

  <!-- Headline -->
  <text font-family="'Fraunces', 'Iowan Old Style', Georgia, serif" font-weight="540"
        font-size="104" fill="#1A1814" letter-spacing="-2"
        x="80" y="320">The <tspan fill="#D2542A" font-style="italic">social</tspan> home</text>
  <text font-family="'Fraunces', 'Iowan Old Style', Georgia, serif" font-weight="540"
        font-size="104" fill="#1A1814" letter-spacing="-2"
        x="80" y="424">for your <tspan fill="#D2542A" font-style="italic">household</tspan>.</text>

  <!-- Sub headline -->
  <text font-family="'Manrope', sans-serif" font-weight="500"
        font-size="26" fill="#4A4439" x="80" y="500">Calendars, lists, photos, calls, chat — running on your own Home Assistant.</text>
  <text font-family="'Manrope', sans-serif" font-weight="500"
        font-size="26" fill="#4A4439" x="80" y="538">A household OS that's also a social network you actually own.</text>

  <!-- URL pill (bottom-right) -->
  <g transform="translate(870,540)">
    <rect width="250" height="44" rx="22" fill="#1A1814"/>
    <text font-family="'JetBrains Mono', monospace" font-weight="600"
          font-size="15" fill="#F4ECE0" x="125" y="29" text-anchor="middle" letter-spacing="0.6">SOCIAL-HOME.IO</text>
  </g>
</svg>
